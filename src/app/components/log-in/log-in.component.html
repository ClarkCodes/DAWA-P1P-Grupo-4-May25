<!-- Contenedor principal del formulario de inicio de sesión -->
<div class="login-container" (keyup.enter)="onEnterKeyUp()">
  <div class="LoginUGEventosLogoDiv">
    <img src="/images/Logo_UG_EVENTOS_white.webp" alt="UGEventos Logo">
  </div>
  <!-- Título del formulario -->
  <h2>Iniciar sesión</h2>
  <!-- Formulario de login con validaciones de Angular Reactive Forms -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div class="login-mail-pwd-div">
      <!-- Campo para el correo electrónico -->
      <mat-form-field class="login-mat-form-field">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>mail</mat-icon>
        <input
          type="email"
          matInput
          formControlName="email"
          placeholder="Ej.: usuario@correo.com"
        />
      </mat-form-field>
      <!-- Mensajes de error para el campo email -->
      <mat-error class="formError" *ngIf="loginForm.get( 'email' )?.touched && loginForm.get( 'email' )?.hasError( 'required' )">
        Email requerido
      </mat-error>
      <mat-error class="formError" *ngIf="loginForm.get( 'email' )?.touched && loginForm.get( 'email' )?.hasError( 'email' )">
        Email no válido
      </mat-error>

      <!-- Campo para la contraseña -->
      <mat-form-field class="login-mat-form-field">
        <mat-label>Contraseña</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input
          matInput
          [type]="isPasswordHidden() ? 'password' : 'text'"
          formControlName="password"
          placeholder="contraseña123"
          (keyup.enter)="onEnterKeyUp()"
        />
        <!-- Botón para mostrar/ocultar contraseña -->
        <button
          mat-icon-button
          matSuffix
          (click)="showHidePassword( $event )"
          [attr.aria-label]="'Mostrar/ocultar contraseña'"
          [attr.aria-pressed]="isPasswordHidden()"
          type="button"
        >
          <mat-icon>{{ isPasswordHidden() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
      <!-- Mensaje de error para el campo contraseña -->
      <mat-error class="formError" *ngIf="loginForm.get( 'password' )?.touched && loginForm.get( 'password' )?.hasError( 'required' )">
        Contraseña requerida
      </mat-error>
    </div>

    <!-- Botón de envío del formulario -->
    <button
      mat-stroked-button
      #submitBtn
      class="submit-btn"
      type="submit"
      [disabled]="loginForm.invalid"
      aria-label="Iniciar sesión"
    >
      <span>
        Acceder
      </span>
    </button>
    <!-- Enlace para registrarse -->
    <div class="RegistrarseDiv">
      <span>
        ¿No tienes una cuenta? <a mat-button [routerLink]="['/signup']" class="Registrarse-button-link">Regístrate</a>
      </span>
    </div>
  </form>
</div>
